<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מילים לפסיכומטרי</title>
<meta name="description" content="אפליקציה אישית לשינון מילים לפסיכומטרי — כרטיסיות, משחקים וקבוצות.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4b3fcf">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141317" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="מילים">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;600;700&display=swap">
<style>
  html,body{ height:100%; }
  img{ max-width:100%; }
  [hidden]{ display:none!important; }
  :root{ padding-top:env(safe-area-inset-top,0px); }
  /* Layout: mobile-first single column, max 560px, fixed bottom tab bar.
     Palette: warm "paper + ink" study look — indigo ink accent, emerald=known, coral=unknown, gold detail. */
  :root{
    color-scheme: light;
    --bg:#f5f3ee; --surface:#ffffff; --surface-2:#efece4; --surface-3:#e7e3d9;
    --text:#1d1b19; --muted:#726d64; --faint:#a39d92; --border:#e4e0d6;
    --accent:#4b3fcf; --accent-2:#6a5ff0; --accent-soft:#e9e7fb; --on-accent:#ffffff;
    --know:#0e9e6e; --know-soft:#dbf4ea; --dont:#dd5346; --dont-soft:#fbe4e0;
    --gold:#b5852a; --warn:#c7881e;
    --shadow:0 1px 2px rgba(30,25,15,.05),0 6px 20px rgba(30,25,15,.07);
    --shadow-lg:0 10px 40px rgba(30,25,15,.16);
    --r:16px; --r-sm:11px; --r-lg:22px;
    --ui:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    --word:"Frank Ruhl Libre","Heebo",serif;
    --maxw:560px;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    color-scheme: dark;
    --bg:#141317; --surface:#1e1d24; --surface-2:#262630; --surface-3:#30303c;
    --text:#ece8e1; --muted:#9d978c; --faint:#6c665d; --border:#34343f;
    --accent:#8a81f2; --accent-2:#9d95f6; --accent-soft:#2a2846; --on-accent:#14121f;
    --know:#33c58d; --know-soft:#173a2d; --dont:#f0786b; --dont-soft:#3a211e;
    --gold:#d7a64c; --warn:#e0a53a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
    --shadow-lg:0 14px 46px rgba(0,0,0,.55);
  }}
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#141317; --surface:#1e1d24; --surface-2:#262630; --surface-3:#30303c;
    --text:#ece8e1; --muted:#9d978c; --faint:#6c665d; --border:#34343f;
    --accent:#8a81f2; --accent-2:#9d95f6; --accent-soft:#2a2846; --on-accent:#14121f;
    --know:#33c58d; --know-soft:#173a2d; --dont:#f0786b; --dont-soft:#3a211e;
    --gold:#d7a64c; --warn:#e0a53a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
    --shadow-lg:0 14px 46px rgba(0,0,0,.55);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    direction:rtl; background:var(--bg); color:var(--text);
    font-family:var(--ui); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  #app{ max-width:var(--maxw); margin:0 auto; min-height:100%;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-bottom:calc(84px + env(safe-area-inset-bottom,0px)); }
  .page{ padding-top:14px; }
  h1,h2,h3{ margin:0; text-wrap:balance; font-weight:700; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  button:focus-visible,[tabindex]:focus-visible{ outline:2.5px solid var(--accent); outline-offset:2px; border-radius:8px; }
  .muted{ color:var(--muted); }
  .faint{ color:var(--faint); }
  .nikud{ font-family:var(--word); font-weight:500; }

  /* ---- top bar ---- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 2px 6px; }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand .logo{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
    background:linear-gradient(145deg,var(--accent),var(--accent-2)); color:#fff; font-weight:800; font-size:17px; box-shadow:var(--shadow); }
  .brand h1{ font-size:18px; letter-spacing:-.2px; }
  .brand .sub{ font-size:11.5px; color:var(--muted); margin-top:-2px; }
  .iconbtn{ width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
    background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); font-size:17px; }

  /* ---- cards / tiles ---- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); }
  .pad{ padding:16px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .wrap{ flex-wrap:wrap; }
  .spread{ justify-content:space-between; }
  .stack{ display:flex; flex-direction:column; gap:12px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .sect-title{ font-size:12.5px; font-weight:700; letter-spacing:.06em; color:var(--muted); text-transform:none; margin:20px 2px 10px; }

  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:14px; text-align:center; box-shadow:var(--shadow); }
  .stat .n{ font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.5px; }
  .stat .l{ font-size:12px; color:var(--muted); margin-top:2px; }

  /* progress ring */
  .ring-wrap{ display:flex; align-items:center; gap:16px; }
  .ring{ position:relative; width:104px; height:104px; flex:0 0 auto; }
  .ring svg{ transform:rotate(-90deg); }
  .ring .val{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; }
  .ring .val b{ font-size:25px; font-weight:800; font-variant-numeric:tabular-nums; }
  .ring .val span{ font-size:10.5px; color:var(--muted); display:block; }

  /* chips */
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ padding:8px 13px; border-radius:999px; background:var(--surface); border:1px solid var(--border);
    font-size:13.5px; font-weight:600; color:var(--text); box-shadow:var(--shadow); display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .chip.on{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .chip .cnt{ font-size:11px; opacity:.7; font-variant-numeric:tabular-nums; }

  /* buttons */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 16px; border-radius:var(--r-sm); font-weight:700; font-size:15px;
    background:var(--surface-2); color:var(--text); border:1px solid var(--border); box-shadow:var(--shadow); transition:transform .06s; }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .btn.ghost{ background:transparent; box-shadow:none; }
  .btn.block{ width:100%; }
  .btn.lg{ padding:15px; font-size:16px; }
  .btn.sm{ padding:9px 12px; font-size:13.5px; border-radius:10px; }
  .btn:disabled{ opacity:.45; cursor:default; }

  /* tab bar */
  .tabbar{ position:fixed; bottom:0; left:0; right:0; z-index:40;
    display:flex; justify-content:center; gap:2px;
    background:color-mix(in srgb,var(--surface) 92%,transparent); backdrop-filter:blur(12px);
    border-top:1px solid var(--border);
    padding:7px max(10px,env(safe-area-inset-left,0px)) calc(7px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px)); }
  .tabbar .inner{ display:flex; width:100%; max-width:var(--maxw); gap:2px; }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; border-radius:12px; color:var(--muted); font-size:10.5px; font-weight:600; }
  .tab .ic{ font-size:19px; line-height:1; }
  .tab.on{ color:var(--accent); }
  .tab.on .ic{ transform:translateY(-1px); }

  /* flashcard */
  .deckbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:10px 13px; box-shadow:var(--shadow); }
  .deckbar .nm{ font-weight:700; font-size:14.5px; }
  .deckbar .mt{ font-size:11.5px; color:var(--muted); }

  .flip{ perspective:1600px; width:100%; }
  .flip-inner{ position:relative; width:100%; min-height:300px; transition:transform .5s cubic-bezier(.4,.1,.2,1); transform-style:preserve-3d; }
  .flip.flipped .flip-inner{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    border-radius:var(--r-lg); border:1px solid var(--border); box-shadow:var(--shadow-lg); padding:26px 22px; }
  .face.front{ background:linear-gradient(170deg,var(--surface),var(--surface-2)); }
  .face.back{ transform:rotateY(180deg); background:linear-gradient(170deg,var(--accent-soft),var(--surface)); }
  .face .klabel{ position:absolute; top:14px; right:16px; font-size:11px; font-weight:700; color:var(--faint); letter-spacing:.05em; }
  .face .word{ font-family:var(--word); font-weight:700; font-size:clamp(34px,10vw,52px); line-height:1.25; color:var(--text); }
  .face .mean{ font-size:clamp(18px,5.2vw,23px); font-weight:500; line-height:1.5; color:var(--text); }
  .face .mean .mi{ display:block; margin:5px 0; }
  .face .mean .mi + .mi{ border-top:1px dashed var(--border); padding-top:8px; }
  .face .hint{ position:absolute; bottom:13px; font-size:11.5px; color:var(--faint); }
  .statusdot{ position:absolute; top:14px; left:16px; width:10px; height:10px; border-radius:50%; }
  .statusdot.know{ background:var(--know); } .statusdot.dont{ background:var(--dont); } .statusdot.seen{ background:var(--gold); } .statusdot.new{ background:var(--faint); opacity:.5; }

  .progressbar{ height:6px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
  .progressbar>i{ display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .25s; }

  .know-btn{ background:var(--know-soft); color:var(--know); border-color:transparent; }
  .dont-btn{ background:var(--dont-soft); color:var(--dont); border-color:transparent; }
  .seen-btn{ background:color-mix(in srgb,var(--gold) 15%,var(--surface)); color:var(--gold); border-color:transparent; }

  /* modal / sheet */
  .scrim{ position:fixed; inset:0; z-index:60; background:rgba(15,12,8,.5); display:flex; align-items:flex-end; justify-content:center; animation:fade .15s; }
  @keyframes fade{ from{opacity:0} }
  .sheet{ width:100%; max-width:var(--maxw); background:var(--bg); border-radius:22px 22px 0 0; border:1px solid var(--border); box-shadow:var(--shadow-lg);
    padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px)); max-height:86vh; overflow:auto; animation:up .22s cubic-bezier(.3,.7,.3,1); }
  @keyframes up{ from{ transform:translateY(100%) } }
  .sheet .grab{ width:40px; height:4px; border-radius:99px; background:var(--border); margin:2px auto 12px; }
  .sheet h3{ font-size:16px; margin-bottom:6px; }

  .field{ width:100%; padding:12px 13px; border-radius:11px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-family:inherit; font-size:15px; }
  .field.nikud{ font-family:var(--word); }
  textarea.field{ resize:vertical; min-height:46px; }
  input.field::placeholder,textarea.field::placeholder{ color:var(--faint); }

  /* list rows */
  .lrow{ display:flex; align-items:center; gap:11px; padding:11px 13px; background:var(--surface); border:1px solid var(--border); border-radius:13px; box-shadow:var(--shadow); }
  .lrow .w{ font-family:var(--word); font-weight:700; font-size:20px; }
  .lrow .m{ font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill{ font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:99px; }
  .pill.know{ background:var(--know-soft); color:var(--know); } .pill.dont{ background:var(--dont-soft); color:var(--dont); } .pill.seen{ background:color-mix(in srgb,var(--gold) 15%,var(--surface)); color:var(--gold); }
  /* persistent app bar with home button */
  .appbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 2px 8px; }
  .brand-btn{ display:flex; align-items:center; gap:9px; text-align:right; }
  .brand-btn .logo{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:linear-gradient(145deg,var(--accent),var(--accent-2)); color:#fff; font-weight:800; font-size:17px; box-shadow:var(--shadow); flex:0 0 auto; }
  .brand-btn h1{ font-size:17px; letter-spacing:-.2px; }
  .brand-btn .sub{ font-size:11.5px; color:var(--muted); margin-top:-2px; }
  .brand-btn .ttl{ font-size:17px; font-weight:700; }

  /* games */
  .gprompt{ text-align:center; padding:22px 16px; }
  .gprompt .w{ font-family:var(--word); font-weight:700; font-size:clamp(30px,8.5vw,46px); }
  .gprompt .m{ font-size:clamp(18px,5vw,22px); font-weight:500; line-height:1.45; }
  .opt{ width:100%; text-align:right; padding:14px 15px; border-radius:13px; background:var(--surface); border:1.5px solid var(--border); box-shadow:var(--shadow); font-size:15.5px; font-weight:500; line-height:1.4; transition:transform .05s; }
  .opt.nikud{ font-family:var(--word); font-size:21px; font-weight:600; }
  .opt:active{ transform:scale(.985); }
  .opt.correct{ background:var(--know-soft); border-color:var(--know); color:var(--know); font-weight:700; }
  .opt.wrong{ background:var(--dont-soft); border-color:var(--dont); color:var(--dont); }
  .opt.dim{ opacity:.5; }
  .timer{ height:7px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
  .timer>i{ display:block; height:100%; background:var(--gold); border-radius:99px; }
  .gtop{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .score{ font-weight:800; font-variant-numeric:tabular-nums; font-size:16px; }

  .match-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .mcell{ padding:13px 10px; border-radius:12px; background:var(--surface); border:1.5px solid var(--border); box-shadow:var(--shadow); font-size:14px; font-weight:600; line-height:1.3; min-height:62px; display:flex; align-items:center; justify-content:center; text-align:center; }
  .mcell.word{ font-family:var(--word); font-size:19px; }
  .mcell.sel{ border-color:var(--accent); background:var(--accent-soft); }
  .mcell.gone{ opacity:0; pointer-events:none; transition:opacity .3s; }
  .mcell.bad{ border-color:var(--dont); animation:shake .3s; }
  @keyframes shake{ 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

  .result{ text-align:center; padding:12px; }
  .result .big{ font-size:46px; font-weight:800; font-variant-numeric:tabular-nums; }
  .emptyst{ text-align:center; color:var(--muted); padding:44px 16px; }
  .emptyst .ic{ font-size:40px; opacity:.5; margin-bottom:8px; }

  .toast{ position:fixed; bottom:calc(92px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); z-index:80;
    background:var(--text); color:var(--bg); padding:10px 16px; border-radius:99px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow-lg); animation:fade .15s; }
  .seg{ display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:3px; gap:3px; }
  .seg button{ flex:1; padding:8px; border-radius:9px; font-size:13px; font-weight:700; color:var(--muted); }
  .seg button.on{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms!important; transition-duration:.01ms!important; } }
</style>
</head>
<body>
<div id="app"></div>

<script src="lib/preact.umd.js"></script>
<script src="lib/hooks.umd.js"></script>
<script src="lib/htm.umd.js"></script>
<script src="words.js"></script>
<script>
(function(){
  const { h, render, Fragment } = preact;
  const { useState, useEffect, useRef, useMemo, useCallback } = preactHooks;
  const html = htm.bind(h);
  const WORDS = (window.WORDS||[]).slice();
  const byId = new Map(WORDS.map(w=>[w.id,w]));
  const UNITS = [...new Set(WORDS.map(w=>w.u))].filter(u=>u!=null).sort((a,b)=>a-b);
  const SESSION = Math.random().toString(36).slice(2);
  const STL = {know:'יודע',dont:'לא יודע',seen:'נבדק'};

  const stripN = s => (s||'').normalize('NFC').replace(/[֑-ׇ]/g,'');
  const normType = s => stripN(s).replace(/[\s'"־\-\/\.\,\(\)]/g,'');
  const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const sample = (a,n,exclude)=>{ const pool=a.filter(x=>!exclude||!exclude.has(x)); return shuffle(pool).slice(0,n); };

  /* ============ persistence ============ */
  const LS='milim_state_v1';
  const emptyState=()=>({status:{},groups:[],edits:{},stats:{}});
  function loadLocal(){ try{ const s=JSON.parse(localStorage.getItem(LS)); return s&&typeof s==='object'?Object.assign(emptyState(),s):emptyState(); }catch(e){ return emptyState(); } }
  function saveLocal(s){ try{ localStorage.setItem(LS, JSON.stringify(s)); }catch(e){} }

  let cloudDoc=null, cloudReady=false;
  async function initCloud(onRemote){
    try{
      const use = window.claude&&window.claude.use; if(!use) return;
      const db = await window.claude.use('db'); const user = await window.claude.use('user');
      if(!db||!user) return;
      const id = await user.id();
      cloudDoc = db.collection('data/users/'+id).doc('appstate');
      cloudReady=true;
      let settled=false;
      const timer=setTimeout(()=>{ settled=true; }, 10000);
      cloudDoc.onSnapshot(snap=>{
        settled=true; clearTimeout(timer);
        const d = snap && (snap.data ? snap.data() : snap.get && snap.get());
        if(d && d._by && d._by!==SESSION){ onRemote(stripMeta(d)); }
        else if(d && !d._by){ onRemote(stripMeta(d)); }
      }, err=>{});
    }catch(e){}
  }
  function stripMeta(d){ const o=emptyState(); ['status','groups','edits','stats'].forEach(k=>{ if(d[k]!=null) o[k]=d[k]; }); return o; }
  let writeTimer=null;
  function cloudWrite(state){
    if(!cloudReady||!cloudDoc) return;
    clearTimeout(writeTimer);
    writeTimer=setTimeout(()=>{
      try{ cloudDoc.set(Object.assign({}, state, {_by:SESSION,_ts:Date.now()})); }catch(e){}
    }, 650);
  }

  /* ============ store hook ============ */
  function useStore(){
    const [state,setState]=useState(loadLocal);
    const ref=useRef(state); ref.current=state;
    useEffect(()=>{ initCloud(remote=>{ setState(cur=>{ const merged=Object.assign({},cur,remote); ref.current=merged; return merged; }); }); },[]);
    const commit = useCallback((updater)=>{
      setState(cur=>{ const next = typeof updater==='function'?updater(cur):updater; ref.current=next; saveLocal(next); cloudWrite(next); return next; });
    },[]);
    return [state, commit];
  }

  /* ============ word helpers ============ */
  const effWord = (w,edits)=>{ const e=edits&&edits[w.id]; return e?{id:w.id,u:w.u,w:e.w,m:e.m}:w; };

  /* ============ small components ============ */
  function Ring({pct,size=104,stroke=11,label}){
    const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-pct/100);
    return html`<div class="ring" style=${{width:size,height:size}}>
      <svg width=${size} height=${size}>
        <circle cx=${size/2} cy=${size/2} r=${r} fill="none" stroke="var(--surface-3)" stroke-width=${stroke}/>
        <circle cx=${size/2} cy=${size/2} r=${r} fill="none" stroke="var(--know)" stroke-width=${stroke} stroke-linecap="round" stroke-dasharray=${c} stroke-dashoffset=${off}/>
      </svg>
      <div class="val"><div><b>${Math.round(pct)}%</b><span>${label||'ידוע'}</span></div></div>
    </div>`;
  }
  function Toast({msg}){ return msg?html`<div class="toast">${msg}</div>`:null; }

  /* ============ Deck picker ============ */
  function DeckSheet({deck,onlyUnknown,groups,status,onClose,onPick}){
    const unitCount=u=>WORDS.filter(w=>w.u===u).length;
    const unknownCount=(arr)=>arr.filter(w=>status[w.id]!=='know').length;
    return html`<div class="scrim" onClick=${onClose}><div class="sheet" onClick=${e=>e.stopPropagation()}>
      <div class="grab"></div>
      <h3>בחירת חפיסה</h3>
      <div class="muted" style="font-size:12.5px;margin-bottom:12px">מאיזה אוסף מילים ללמוד או לשחק</div>
      <div class="sect-title" style="margin-top:4px">כללי</div>
      <div class="chips">
        <button class=${'chip '+(deck.type==='all'?'on':'')} onClick=${()=>onPick({type:'all'})}>כל המילים <span class="cnt">${WORDS.length}</span></button>
      </div>
      <div class="sect-title">יחידות</div>
      <div class="chips">
        ${UNITS.map(u=>html`<button class=${'chip '+(deck.type==='unit'&&deck.key===u?'on':'')} onClick=${()=>onPick({type:'unit',key:u})}>יחידה ${u} <span class="cnt">${unitCount(u)}</span></button>`)}
      </div>
      <div class="sect-title">הקבוצות שלי</div>
      ${groups.length? html`<div class="chips">${groups.map(g=>html`<button class=${'chip '+(deck.type==='group'&&deck.key===g.id?'on':'')} onClick=${()=>onPick({type:'group',key:g.id})}>${g.name} <span class="cnt">${g.ids.length}</span></button>`)}</div>`
        : html`<div class="muted" style="font-size:13px">עדיין אין קבוצות. אפשר ליצור בלשונית «קבוצות».</div>`}
      <div class="sect-title">סינון</div>
      <button class=${'chip '+(onlyUnknown?'on':'')} onClick=${()=>onPick({toggleUnknown:true})}>${onlyUnknown?'✓ ':''}רק מילים שלא ידעתי</button>
      <button class="btn block primary" style="margin-top:16px" onClick=${onClose}>סיום</button>
    </div></div>`;
  }

  function deckBaseArr(deck,groups){
    if(deck.type==='unit') return WORDS.filter(w=>w.u===deck.key);
    if(deck.type==='group'){ const g=groups.find(x=>x.id===deck.key); const set=new Set(g?g.ids:[]); return WORDS.filter(w=>set.has(w.id)); }
    return WORDS;
  }
  function deckWords(deck,groups,status,edits,onlyUnknown){
    let arr=deckBaseArr(deck,groups);
    if(deck.filter==='dont') arr=arr.filter(w=>status[w.id]==='dont');
    else if(deck.cs && deck.cs>0){ const start=(deck.ci||0)*deck.cs; arr=arr.slice(start,start+deck.cs); }
    if(onlyUnknown) arr=arr.filter(w=>status[w.id]!=='know');
    return arr.map(w=>effWord(w,edits));
  }
  function deckName(deck,groups){
    if(deck.type==='all') return 'כל המילים';
    if(deck.type==='unit') return 'יחידה '+deck.key;
    if(deck.type==='group'){ const g=groups.find(x=>x.id===deck.key); return g?g.name:'קבוצה'; }
    return '';
  }

  /* ============ Edit word sheet ============ */
  function EditSheet({word,onClose,onSave,onReset,isEdited}){

      <label class="muted" style="font-size:12px;font-weight:700">המילה (עם ניקוד)</label>
      <input class="field nikud" style="font-size:22px;margin:5px 0 14px" value=${w} onInput=${e=>setW(e.target.value)}/>
      <label class="muted" style="font-size:12px;font-weight:700">פירושים (שורה לכל פירוש)</label>

        <button class="btn ghost" onClick=${onClose}>ביטול</button>

    </div></div>`;
  }

  /* ============ Flashcards ============ */
  function Flashcards({words,status,setStatus,onEdit,deckLabel,onChangeDeck,chunk,onChunk}){
    // snapshot the deck for the session so marking a word in a filtered deck doesn't reshuffle/reset mid-pass
    const [cards,setCards]=useState(()=>words);
    const [i,setI]=useState(0);
    const [flipped,setFlipped]=useState(false);
    const [order,setOrder]=useState(()=>words.map((_,k)=>k));
    useEffect(()=>{ setCards(words); setOrder(words.map((_,k)=>k)); setI(0); setFlipped(false); },[deckLabel]);
    if(!cards.length) return html`<${DeckBar} label=${deckLabel} count=0 onChangeDeck=${onChangeDeck} chunk=${chunk} onChunk=${onChunk}/><div class="emptyst"><div class="ic">🃏</div>אין מילים בחפיסה הזו.<br/>בחרו חפיסה אחרת או בטלו את הסינון.</div>`;
    const idx=order[Math.min(i,order.length-1)];
    const w=cards[idx];
    const st=status[w.id];
    const go=(d)=>{ setFlipped(false); setI(v=>Math.max(0,Math.min(order.length-1,v+d))); };
    const mark=(val)=>{ setStatus(w.id, st===val?null:val); setTimeout(()=>{ if(i<order.length-1) go(1); },120); };
    const reshuffle=()=>{ setOrder(shuffle(cards.map((_,k)=>k))); setI(0); setFlipped(false); };
    return html`<${Fragment}>
      <${DeckBar} label=${deckLabel} count=${cards.length} onChangeDeck=${onChangeDeck} chunk=${chunk} onChunk=${onChunk} extra=${html`<button class="btn sm ghost" onClick=${reshuffle}>🔀 ערבוב</button>`}/>
      <div class="row spread" style="margin:14px 2px 10px">
        <span class="muted" style="font-size:12.5px">${i+1} / ${order.length}</span>
        <button class="btn sm ghost" onClick=${()=>onEdit(w)}>✎ עריכה</button>
      </div>
      <div class="progressbar" style="margin-bottom:16px"><i style=${{width:((i+1)/order.length*100)+'%'}}></i></div>
      <div class=${'flip '+(flipped?'flipped':'')} onClick=${()=>setFlipped(f=>!f)}>
        <div class="flip-inner" key=${w.id}>
          <div class="face front">
            <span class="klabel">מילה</span>
            <span class=${'statusdot '+(st||'new')}></span>
            <div class="word">${w.w}</div>
            <div class="hint">הקישו להצגת הפירוש</div>
          </div>
          <div class="face back">
            <span class="klabel">פירוש</span>
            <div class="mean">${w.m.map((m,k)=>html`<span class="mi" key=${k}>${m}</span>`)}</div>
            <div class="hint">הקישו לחזרה למילה</div>
          </div>
        </div>
      </div>
      <div style="margin-top:18px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <button class="btn dont-btn" style="padding:15px 6px;font-size:15px" onClick=${()=>mark('dont')}>${st==='dont'?'✓ ':''}לא יודע</button>
        <button class="btn seen-btn" style="padding:15px 6px;font-size:15px" onClick=${()=>mark('seen')}>${st==='seen'?'✓ ':''}דלג</button>
        <button class="btn know-btn" style="padding:15px 6px;font-size:15px" onClick=${()=>mark('know')}>${st==='know'?'✓ ':''}יודע</button>
      </div>
      <div class="muted" style="text-align:center;font-size:11.5px;margin-top:9px">אפשר פשוט לדלג בלי להחליט — המילה תסומן «נבדק»</div>
      <div class="row spread" style="margin-top:10px">
        <button class="btn sm" onClick=${()=>go(-1)} disabled=${i===0}>→ הקודם</button>
        <button class="btn sm" onClick=${()=>go(1)} disabled=${i>=order.length-1}>הבא ←</button>
      </div>
    </${Fragment}>`;
  }
  function DeckBar({label,count,onChangeDeck,extra,chunk,onChunk}){
    return html`<div class="deckbar" style="flex-direction:column;align-items:stretch;gap:9px">
      <div class="row spread">
        <div><div class="nm">${label}</div><div class="mt">${count} מילים${chunk?` · מנה ${chunk.ci+1}/${chunk.count}`:''}</div></div>
        <div class="row" style="gap:7px">${extra}<button class="btn sm" onClick=${onChangeDeck}>החלפה</button></div>
      </div>
      ${chunk&&chunk.count>1?html`<div class="row" style="gap:8px">
        <button class="btn sm" style="flex:1" onClick=${()=>onChunk(-1)} disabled=${chunk.ci===0}>→ מנה קודמת</button>
        <span class="mt" style="white-space:nowrap;align-self:center">מילים ${chunk.start+1}–${chunk.end}</span>
        <button class="btn sm" style="flex:1" onClick=${()=>onChunk(1)} disabled=${chunk.ci>=chunk.count-1}>מנה הבאה ←</button>
      </div>`:''}
    </div>`;
  }

  /* ============ Games ============ */
  const GAMES=[
    {k:'mc_wm',name:'מילה ← פירוש',emoji:'🎯',desc:'בחרו את הפירוש הנכון'},
    {k:'mc_mw',name:'פירוש ← מילה',emoji:'🔤',desc:'בחרו את המילה הנכונה'},
    {k:'tf',name:'נכון או לא',emoji:'⚖️',desc:'האם ההתאמה נכונה'},
    {k:'match',name:'התאמה',emoji:'🧩',desc:'חברו מילה לפירוש'},
    {k:'type',name:'הקלדה',emoji:'⌨️',desc:'הקלידו את המילה'},
    {k:'letters',name:'אות חסרה',emoji:'🔡',desc:'השלימו את האות'},
    {k:'race',name:'מרוץ 60 שניות',emoji:'⏱️',desc:'כמה שיותר, מהר'},
  ];
  function GamesMenu({onPlay,stats,deckLabel,onChangeDeck,count,chunk,onChunk}){
    return html`<${Fragment}>
      <${DeckBar} label=${deckLabel} count=${count} onChangeDeck=${onChangeDeck} chunk=${chunk} onChunk=${onChunk}/>
      ${count<4?html`<div class="emptyst" style="padding-top:28px"><div class="ic">🎲</div>צריך לפחות 4 מילים בחפיסה כדי לשחק.</div>`:html`
      <div class="sect-title">בחרו משחק</div>
      <div class="stack">
        ${GAMES.map(g=>html`<button class="card pad row spread" style="width:100%;text-align:right" onClick=${()=>onPlay(g.k)} key=${g.k}>
          <div class="row" style="gap:12px"><span style="font-size:26px">${g.emoji}</span><span><div style="font-weight:700;font-size:15.5px">${g.name}</div><div class="muted" style="font-size:12.5px">${g.desc}</div></span></div>
          <div style="text-align:left">${stats[g.k]&&stats[g.k].best!=null?html`<div class="muted" style="font-size:11px">שיא</div><div class="score" style="color:var(--gold)">${stats[g.k].best}</div>`:html`<span class="faint" style="font-size:20px">‹</span>`}</div>
        </button>`)}
      </div>`}

  function GameHost({gameKey,words,onExit,onScore,best}){
    const g=GAMES.find(x=>x.k===gameKey);
    const common={words,onExit,onDone:(score)=>onScore(gameKey,score),best};
    const map={mc_wm:McGame,mc_mw:McGame,tf:TfGame,match:MatchGame,type:TypeGame,letters:LettersGame,race:RaceGame};
    const Comp=map[gameKey];
    return html`<div class="gtop"><button class="btn sm" onClick=${onExit}>✕ יציאה</button><div style="font-weight:700">${g.emoji} ${g.name}</div><div style="width:56px"></div></div><${Comp} ...${common} mode=${gameKey}/>`;
  }

  function Results({score,total,unit,best,onAgain,onExit}){
    const nb = best!=null && score>=best;
    return html`<div class="card pad result stack" style="align-items:center;margin-top:20px">
      <div class="muted">התוצאה שלך</div>
      <div class="big" style="color:var(--accent)">${score}${total!=null?html`<span class="muted" style="font-size:24px">/${total}</span>`:''}${unit||''}</div>
      ${nb?html`<div class="pill" style="background:var(--gold);color:#fff;font-size:12px">⭐ שיא חדש!</div>`:''}
      <div class="grid2" style="width:100%;margin-top:8px">
        <button class="btn primary" onClick=${onAgain}>עוד פעם</button>
        <button class="btn" onClick=${onExit}>לתפריט</button>
      </div>
    </div>`;
  }

  // Multiple choice (word->meaning or meaning->word)
  function McGame({words,onDone,mode,best}){
    const ROUND=Math.min(10,words.length);
    const meaningsPool=useMemo(()=>words.map(w=>w.m[0]),[words]);
    const build=useCallback(()=>{
      const qs=sample(words,ROUND);
      return qs.map(w=>{
        const correct = mode==='mc_mw' ? w.w : w.m[0];
        const otherField = mode==='mc_mw' ? words.filter(x=>x.id!==w.id).map(x=>x.w) : words.filter(x=>x.id!==w.id).map(x=>x.m[0]);
        const distract = sample([...new Set(otherField.filter(x=>x!==correct))],3);
        return {w, prompt: mode==='mc_mw'? w.m[0] : w.w, promptWord: mode!=='mc_mw', correct, opts: shuffle([correct,...distract])};
      });
    },[words,mode]);
    const [qs,setQs]=useState(build);
    const [qi,setQi]=useState(0); const [score,setScore]=useState(0); const [pick,setPick]=useState(null); const [done,setDone]=useState(false);
    const q=qs[qi];
    const choose=(o)=>{ if(pick!=null) return; setPick(o); if(o===q.correct) setScore(s=>s+1);
      setTimeout(()=>{ if(qi<qs.length-1){ setQi(qi+1); setPick(null);} else { setDone(true);} },820); };
    useEffect(()=>{ if(done) onDone(score); },[done]);
    if(done) return html`<${Results} score=${score} total=${qs.length} best=${best} onAgain=${()=>{setQs(build());setQi(0);setScore(0);setPick(null);setDone(false);}} onExit=${()=>onDone(score,true)}/>`;
    const answerIsWord = mode==='mc_mw';
    return html`<div>
      <div class="gtop"><span class="muted">שאלה ${qi+1}/${qs.length}</span><span class="score">${score} ✓</span></div>
      <div class="card gprompt" style="margin-bottom:14px">
        <div class="muted" style="font-size:12px;margin-bottom:6px">${answerIsWord?'מהי המילה לפירוש:':'מה הפירוש של:'}</div>
        <div class=${q.promptWord?'w':'m'}>${q.prompt}</div>
      </div>
      <div class="stack">
        ${q.opts.map((o,k)=>{ let cls='opt'+(answerIsWord?' nikud':''); if(pick!=null){ if(o===q.correct)cls+=' correct'; else if(o===pick)cls+=' wrong'; else cls+=' dim'; }
          return html`<button class=${cls} key=${k} onClick=${()=>choose(o)}>${o}</button>`; })}
      </div>
    </div>`;
  }

  // True / False
  function TfGame({words,onDone,best}){
    const ROUND=Math.min(12,words.length);
    const build=useCallback(()=>sample(words,ROUND).map(w=>{
      const real=Math.random()<0.5;
      let shownMean=w.m[0];
      if(!real){ const other=sample(words.filter(x=>x.id!==w.id&&x.m[0]!==w.m[0]),1)[0]; shownMean=other?other.m[0]:w.m[0]; if(shownMean===w.m[0]) {} }
      return {w, mean:shownMean, truth: real || shownMean===w.m[0]};
    }),[words]);
    const [qs,setQs]=useState(build); const [qi,setQi]=useState(0); const [score,setScore]=useState(0); const [fb,setFb]=useState(null); const [done,setDone]=useState(false);
    const q=qs[qi];
    const ans=(val)=>{ if(fb) return; const ok=val===q.truth; setFb(ok?'ok':'no'); if(ok)setScore(s=>s+1);
      setTimeout(()=>{ if(qi<qs.length-1){setQi(qi+1);setFb(null);} else setDone(true); },720); };
    useEffect(()=>{ if(done) onDone(score); },[done]);
    if(done) return html`<${Results} score=${score} total=${qs.length} best=${best} onAgain=${()=>{setQs(build());setQi(0);setScore(0);setFb(null);setDone(false);}} onExit=${()=>onDone(score,true)}/>`;
    return html`<div>
      <div class="gtop"><span class="muted">${qi+1}/${qs.length}</span><span class="score">${score} ✓</span></div>
      <div class="card gprompt stack" style="margin-bottom:16px;align-items:center;gap:6px">
        <div class="w" style="font-size:clamp(28px,8vw,42px)">${q.w.w}</div>
        <div style="font-size:18px;color:var(--muted)">הפירוש:</div>
        <div class="m" style=${{color: fb? (q.truth?'var(--know)':'var(--dont)'):'var(--text)'}}>${q.mean}</div>
        ${fb&&!q.truth?html`<div class="muted" style="font-size:14px;margin-top:4px">הפירוש הנכון: ${q.w.m[0]}</div>`:''}
      </div>
      <div class="grid2">
        <button class="btn lg dont-btn" onClick=${()=>ans(false)}>✗ לא נכון</button>
        <button class="btn lg know-btn" onClick=${()=>ans(true)}>✓ נכון</button>
      </div>
    </div>`;
  }

  // Matching
  function MatchGame({words,onDone,best}){
    const PAIRS=Math.min(6,words.length);
    const build=useCallback(()=>{ const ws=sample(words,PAIRS); return {ws, left:shuffle(ws.map(w=>({id:w.id,t:w.w,kind:'w'}))), right:shuffle(ws.map(w=>({id:w.id,t:w.m[0],kind:'m'})))}; },[words]);
    const [data,setData]=useState(build);
    const [sel,setSel]=useState(null); const [done,setDone]=useState(new Set()); const [bad,setBad]=useState(null);
    const [tries,setTries]=useState(0); const [t0]=useState(Date.now()); const [finT,setFinT]=useState(null);
    const finished=done.size===data.ws.length;
    useEffect(()=>{ if(finished&&finT==null){ const sec=Math.round((Date.now()-t0)/1000); setFinT(sec); onDone(sec); } },[finished]);
    const tap=(item)=>{ if(done.has(item.id)) return;
      if(!sel){ setSel(item); return; }
      if(sel.kind===item.kind){ setSel(item); return; }
      setTries(t=>t+1);
      if(sel.id===item.id){ const nd=new Set(done); nd.add(item.id); setDone(nd); setSel(null); }
      else { setBad([sel.key||sel.kind+sel.id,item.kind+item.id]); setTimeout(()=>setBad(null),320); setSel(null); }
    };
    if(finished) return html`<${Results} score=${finT} unit=${html`<span style="font-size:22px"> שניות</span>`} best=${best!=null?best:null} onAgain=${()=>{setData(build());setSel(null);setDone(new Set());setFinT(null);setTries(0);}} onExit=${()=>onDone(finT||0,true)}/>`;
    const cell=(item,fontW)=>{ const isSel=sel&&sel.kind===item.kind&&sel.id===item.id; const gone=done.has(item.id); const isBad=bad&&bad.includes(item.kind+item.id);
      return html`<button class=${'mcell '+(fontW?'word ':'')+(isSel?'sel ':'')+(gone?'gone ':'')+(isBad?'bad':'')} onClick=${()=>tap(item)}>${item.t}</button>`; };
    return html`<div>
      <div class="gtop"><span class="muted">${done.size}/${data.ws.length} זוגות</span><span class="muted">${tries} ניסיונות</span></div>
      <div class="match-grid">
        ${data.left.map((it,k)=>html`<${Fragment} key=${'L'+k}>${cell(it,true)}${cell(data.right[k],false)}</${Fragment}>`)}
      </div>
      <div class="muted" style="text-align:center;font-size:12px;margin-top:14px">הקישו מילה ואז את הפירוש המתאים</div>
    </div>`;
  }

  // Typing
  function TypeGame({words,onDone,best}){
    const ROUND=Math.min(10,words.length);
    const build=useCallback(()=>sample(words,ROUND),[words]);
    const [qs,setQs]=useState(build); const [qi,setQi]=useState(0); const [score,setScore]=useState(0);
    const [val,setVal]=useState(''); const [fb,setFb]=useState(null); const [done,setDone]=useState(false);
    const inp=useRef(null);
    const q=qs[qi];
    useEffect(()=>{ if(inp.current&&!fb) inp.current.focus(); },[qi,fb]);
    useEffect(()=>{ if(done) onDone(score); },[done]);
    const check=()=>{ if(fb) return; const ok=normType(val)===normType(q.w); setFb(ok?'ok':'no'); if(ok)setScore(s=>s+1);
      setTimeout(()=>{ if(qi<qs.length-1){setQi(qi+1);setVal('');setFb(null);} else setDone(true); },1100); };
    if(done) return html`<${Results} score=${score} total=${qs.length} best=${best} onAgain=${()=>{setQs(build());setQi(0);setScore(0);setVal('');setFb(null);setDone(false);}} onExit=${()=>onDone(score,true)}/>`;
    return html`<div>
      <div class="gtop"><span class="muted">${qi+1}/${qs.length}</span><span class="score">${score} ✓</span></div>
      <div class="card gprompt" style="margin-bottom:14px"><div class="muted" style="font-size:12px;margin-bottom:6px">הקלידו את המילה (לא חובה ניקוד):</div><div class="m">${q.m[0]}</div></div>
      <input ref=${inp} class="field nikud" style="font-size:24px;text-align:center" value=${val} onInput=${e=>setVal(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter')check();}} placeholder="הקלידו כאן…" disabled=${!!fb}/>
      ${fb?html`<div class="card pad" style="margin-top:12px;text-align:center;background:${fb==='ok'?'var(--know-soft)':'var(--dont-soft)'}">
          <div style="font-weight:700;color:${fb==='ok'?'var(--know)':'var(--dont)'}">${fb==='ok'?'נכון! ✓':'התשובה הנכונה:'}</div>
          <div class="nikud" style="font-size:28px;margin-top:4px">${q.w}</div></div>`
        : html`<button class="btn primary block lg" style="margin-top:14px" onClick=${check}>בדיקה</button>`}
    </div>`;
  }

  // Missing letter
  function LettersGame({words,onDone,best}){
    const ROUND=Math.min(10,words.length);
    const HEB='אבגדהוזחטיכלמנסעפצקרשת';
    const build=useCallback(()=>sample(words,ROUND).map(w=>{
      const bare=stripN(w.w).replace(/[^א-ת]/g,'');
      const letters=[...bare]; if(letters.length<2) return null;
      const pos=Math.floor(Math.random()*letters.length); const missing=letters[pos];
      const norm=c=>({'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'}[c]||c);
      const opts=shuffle([...new Set([missing,...sample([...HEB].filter(c=>norm(c)!==norm(missing)),3)])]).slice(0,4);
      if(!opts.includes(missing)) opts[0]=missing;
      return {w,letters,pos,missing,opts:shuffle(opts)};
    }).filter(Boolean),[words]);
    const [qs,setQs]=useState(build); const [qi,setQi]=useState(0); const [score,setScore]=useState(0); const [pick,setPick]=useState(null); const [done,setDone]=useState(false);
    const q=qs[qi];
    useEffect(()=>{ if(done) onDone(score); },[done]);
    if(!qs.length){ return html`<div class="emptyst">אין מספיק מילים מתאימות למשחק הזה.</div>`; }
    const choose=(o)=>{ if(pick!=null)return; setPick(o); if(o===q.missing)setScore(s=>s+1); setTimeout(()=>{ if(qi<qs.length-1){setQi(qi+1);setPick(null);} else setDone(true); },820); };
    if(done) return html`<${Results} score=${score} total=${qs.length} best=${best} onAgain=${()=>{setQs(build());setQi(0);setScore(0);setPick(null);setDone(false);}} onExit=${()=>onDone(score,true)}/>`;
    const disp=q.letters.map((c,k)=>k===q.pos?(pick?q.missing:'▢'):c).join('');
    return html`<div>
      <div class="gtop"><span class="muted">${qi+1}/${qs.length}</span><span class="score">${score} ✓</span></div>
      <div class="card gprompt" style="margin-bottom:14px">
        <div class="muted" style="font-size:12px;margin-bottom:8px">${q.w.m[0]}</div>
        <div class="w" style="letter-spacing:4px;color:${pick?(pick===q.missing?'var(--know)':'var(--dont)'):'var(--text)'}">${disp}</div>
        ${pick&&pick!==q.missing?html`<div class="muted" style="margin-top:6px">נכון: ${q.w.w}</div>`:''}
      </div>
      <div class="grid2">
        ${q.opts.map((o,k)=>{ let cls='opt nikud'; cls+=' '; cls+='t-center'; if(pick!=null){ if(o===q.missing)cls+=' correct'; else if(o===pick)cls+=' wrong'; else cls+=' dim'; }
          return html`<button class=${cls} style="text-align:center;font-size:26px" key=${k} onClick=${()=>choose(o)}>${o}</button>`; })}
      </div>
    </div>`;
  }

  // Race (60s)
  function RaceGame({words,onDone,best}){
    const DUR=60;
    const [left,setLeft]=useState(DUR); const [score,setScore]=useState(0); const [q,setQ]=useState(null); const [pick,setPick]=useState(null); const [done,setDone]=useState(false);
    const makeQ=useCallback(()=>{ const w=sample(words,1)[0]; const others=words.filter(x=>x.id!==w.id).map(x=>x.m[0]); const d=sample([...new Set(others.filter(x=>x!==w.m[0]))],3); return {w,correct:w.m[0],opts:shuffle([w.m[0],...d])}; },[words]);
    useEffect(()=>{ setQ(makeQ()); },[]);
    useEffect(()=>{ if(done)return; if(left<=0){ setDone(true); return; } const t=setTimeout(()=>setLeft(l=>l-1),1000); return ()=>clearTimeout(t); },[left,done]);
    useEffect(()=>{ if(done) onDone(score); },[done]);
    const choose=(o)=>{ if(pick!=null||done)return; setPick(o); const ok=o===q.correct; if(ok)setScore(s=>s+1); setTimeout(()=>{ setPick(null); setQ(makeQ()); },ok?180:520); };
    if(done) return html`<${Results} score=${score} best=${best} unit=${html`<span style="font-size:22px"> נק'</span>`} onAgain=${()=>{setLeft(DUR);setScore(0);setPick(null);setDone(false);setQ(makeQ());}} onExit=${()=>onDone(score,true)}/>`;
    if(!q) return null;
    return html`<div>
      <div class="gtop"><span class="score" style="color:${left<=10?'var(--dont)':'var(--text)'}">⏱️ ${left}</span><span class="score" style="color:var(--gold)">${score}</span></div>
      <div class="timer" style="margin-bottom:14px"><i style=${{width:(left/DUR*100)+'%',background:left<=10?'var(--dont)':'var(--gold)'}}></i></div>
      <div class="card gprompt" style="margin-bottom:14px"><div class="w">${q.w.w}</div></div>
      <div class="stack">${q.opts.map((o,k)=>{ let cls='opt'; if(pick!=null){ if(o===q.correct)cls+=' correct'; else if(o===pick)cls+=' wrong'; } return html`<button class=${cls} key=${k} onClick=${()=>choose(o)}>${o}</button>`; })}</div>
    </div>`;
  }

  function GroupEditor({group,allStatus,edits,onBack,onSave,onDelete}){
    const [name,setName]=useState(group?group.name:'קבוצה חדשה');

    const idset=new Set(ids);
    const MAX=20;
    const results=useMemo(()=>{ const t=q.trim(); if(!t) return []; const nq=stripN(t);
      return WORDS.map(w=>effWord(w,edits)).filter(w=> stripN(w.w).includes(nq)||w.w.includes(t)||w.m.some(m=>m.includes(t))).slice(0,30); },[q,edits]);
    const toggle=(id)=>{ if(idset.has(id)) setIds(ids.filter(x=>x!==id)); else { if(ids.length>=MAX) return; setIds([...ids,id]); } };
    return html`<${Fragment}>
      <div class="row spread" style="margin:4px 2px 12px"><button class="btn sm ghost" onClick=${onBack}>→ חזרה</button><button class="btn sm primary" onClick=${()=>onSave({id:group?group.id:'g'+Date.now().toString(36),name:name.trim()||'קבוצה',ids})}>שמירה</button></div>

      ${ids.length?html`<div class="chips" style="margin-bottom:12px">${ids.map(id=>{ const w=effWord(byId.get(id),edits); return w?html`<button class="chip nikud on" key=${id} onClick=${()=>toggle(id)}>${w.w} ✕</button>`:null; })}</div>`:''}
      <input class="field" style="margin-bottom:10px" value=${q} onInput=${e=>setQ(e.target.value)} placeholder="חיפוש מילה או פירוש להוספה…"/>
      <div class="stack">
        ${results.map(w=>html`<button class="lrow" key=${w.id} style=${{textAlign:'right',borderColor:idset.has(w.id)?'var(--accent)':'var(--border)'}} onClick=${()=>toggle(w.id)}>

        </button>`)}
        ${q.trim()&&!results.length?html`<div class="muted" style="text-align:center;padding:14px">לא נמצאו מילים</div>`:''}
      </div>
    </${Fragment}>`;
  }

  /* ============ Word list ============ */

      if(filt==='know'||filt==='dont'||filt==='seen') arr=arr.filter(w=>status[w.id]===filt);
      else if(filt==='new') arr=arr.filter(w=>!status[w.id]);
      if(t) arr=arr.filter(w=> stripN(w.w).includes(nq)||w.w.includes(t)||w.m.some(m=>m.includes(t)));

            <div class="row" style="gap:8px"><span class="w">${w.w}</span>${status[w.id]?html`<span class=${'pill '+status[w.id]}>${STL[status[w.id]]}</span>`:''}</div>
            <div class="m">${w.m.join(' · ')}</div>

  /* ============ Unit sheet (study whole unit / a batch of 10-20 / only "don't know") ============ */
  function UnitSheet({unit,status,mode,setMode,batchSize,setBatchSize,onStart,onClose}){
    const all=useMemo(()=>WORDS.filter(w=>w.u===unit),[unit]);
    const [ci,setCi]=useState(0);
    const size=batchSize;
    const count=Math.max(1,Math.ceil(all.length/size));
    useEffect(()=>{ if(ci>count-1) setCi(0); },[size,count,mode]);
    const dontWords=all.filter(w=>status[w.id]==='dont');
    let scope, label, deck;
    if(mode==='batch'){ const a=ci*size,b=Math.min(a+size,all.length); scope=all.slice(a,b); label=`מנה: מילים ${a+1}–${b}`; deck={type:'unit',key:unit,cs:size,ci}; }
    else if(mode==='dont'){ scope=dontWords; label='רק «לא יודע»'; deck={type:'unit',key:unit,filter:'dont'}; }
    else { scope=all; label='כל היחידה'; deck={type:'unit',key:unit}; }
    const known=scope.filter(w=>status[w.id]==='know').length;
    const empty=scope.length===0;
    const MODES=[['all','כל היחידה'],['batch','מנות'],['dont','רק «לא יודע»']];
    return html`<div class="scrim" onClick=${onClose}><div class="sheet" onClick=${e=>e.stopPropagation()}>
      <div class="grab"></div>
      <h3>יחידה ${unit}</h3>
      <div class="muted" style="font-size:12.5px;margin-bottom:12px">${all.length} מילים ביחידה. בחרו על מה לעבוד — בכרטיסיות או במשחקים.</div>
      <div class="sect-title" style="margin-top:2px">מצב לימוד</div>
      <div class="seg">
        ${MODES.map(([m,l])=>html`<button class=${mode===m?'on':''} key=${m} onClick=${()=>setMode(m)}>${l}</button>`)}
      </div>
      ${mode==='batch'?html`
        <div class="sect-title">גודל מנה</div>
        <div class="seg">
          ${[[10,'10 מילים'],[20,'20 מילים']].map(([s,l])=>html`<button class=${size===s?'on':''} key=${s} onClick=${()=>{setBatchSize(s);setCi(0);}}>${l}</button>`)}
        </div>
        <div class="sect-title">בחרו מנה</div>
        <div class="chips">
          ${Array.from({length:count},(_,k)=>{ const a=k*size,b=Math.min(a+size,all.length); const part=all.slice(a,b); const kn=part.filter(w=>status[w.id]==='know').length;
            return html`<button class=${'chip '+(ci===k?'on':'')} key=${k} onClick=${()=>setCi(k)}>${a+1}–${b} <span class="cnt">${kn}/${part.length}</span></button>`; })}
        </div>`:''}
      ${mode==='dont'?html`<div class="muted" style="font-size:12.5px;margin:10px 2px 0">${dontWords.length? `${dontWords.length} מילים שסימנת «לא יודע» ביחידה הזו.` : 'אין עדיין מילים מסומנות «לא יודע» ביחידה הזו. סמנו מילים כ«לא יודע» בכרטיסיות, והן יופיעו כאן.'}</div>`:''}
      <div class="card pad row spread" style="margin-top:14px">
        <span class="muted" style="font-size:13px">${label}</span>
        <b style="font-variant-numeric:tabular-nums">${empty?'0 מילים':`${known}/${scope.length} ידוע`}</b>
      </div>
      <div class="grid2" style="margin-top:14px">
        <button class="btn lg primary" disabled=${empty} onClick=${()=>onStart(deck,'cards')}>🃏 כרטיסיות</button>
        <button class="btn lg" disabled=${empty} onClick=${()=>onStart(deck,'games')}>🎮 משחקים</button>
      </div>
      <button class="btn block ghost" style="margin-top:10px" onClick=${onClose}>ביטול</button>
    </div></div>`;
  }

  /* ============ Settings + backup/restore ============ */
  function SettingsSheet({state,onReplace,onClose,toast}){
    const [err,setErr]=useState(null);
    const doExport=()=>{
      try{
        const payload={app:'milim-psychometry',ver:1,exportedAt:new Date().toISOString(),status:state.status,groups:state.groups,edits:state.edits,stats:state.stats};
        const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
        const url=URL.createObjectURL(blob); const a=document.createElement('a');
        a.href=url; a.download='milim-backup-'+new Date().toISOString().slice(0,10)+'.json';
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),3000);
        toast('הגיבוי הורד');
      }catch(e){ setErr('ההורדה אינה נתמכת בסביבה הזו'); }
    };
    const doImport=(e)=>{ const f=e.target.files&&e.target.files[0]; if(!f){return;} const r=new FileReader();
      r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||typeof d!=='object'){throw 0;}
        onReplace({status:d.status&&typeof d.status==='object'?d.status:{},groups:Array.isArray(d.groups)?d.groups:[],edits:d.edits&&typeof d.edits==='object'?d.edits:{},stats:d.stats&&typeof d.stats==='object'?d.stats:{}});
        toast('הנתונים שוחזרו'); onClose();
      }catch(err){ setErr('הקובץ אינו קובץ גיבוי תקין'); } };
      r.onerror=()=>setErr('קריאת הקובץ נכשלה'); r.readAsText(f); e.target.value='';
    };
    const known=Object.values(state.status).filter(v=>v==='know').length;
    return html`<div class="scrim" onClick=${onClose}><div class="sheet" onClick=${e=>e.stopPropagation()}>
      <div class="grab"></div>
      <h3>הגדרות וגיבוי</h3>
      <div class="muted" style="font-size:12.5px;margin-bottom:14px">הנתונים נשמרים על המכשיר הזה בלבד. גבה קובץ כדי להעביר למכשיר אחר או לשמור עותק.</div>
      <div class="stack">
        <button class="btn primary block lg" onClick=${doExport}>⬇️  גיבוי — הורדת קובץ</button>
        <label class="btn block lg" style="cursor:pointer;display:flex">⬆️  שחזור מקובץ גיבוי
          <input type="file" accept="application/json,.json" style="display:none" onChange=${doImport}/>
        </label>
      </div>
      ${err?html`<div style="color:var(--dont);font-size:13px;margin-top:10px">${err}</div>`:''}
      <div class="muted" style="font-size:11.5px;margin-top:12px">שחזור יחליף את כל ההתקדמות, הקבוצות והתיקונים שבמכשיר זה.</div>
      <div class="card pad" style="margin-top:14px;font-size:12.5px;color:var(--muted)">במכשיר זה: ${WORDS.length} מילים · ${known} מסומנות «יודע» · ${state.groups.length} קבוצות</div>
      <button class="btn block" style="margin-top:14px" onClick=${onClose}>סגירה</button>
    </div></div>`;
  }

  /* ============ Root App ============ */
  function App(){
    const [state,commit]=useStore();
    const [view,setView]=useState('home');
    const [deck,setDeck]=useState({type:'all'});
    const [onlyUnknown,setOnlyUnknown]=useState(false);
    const [showDeck,setShowDeck]=useState(false);
    const [editWord,setEditWord]=useState(null);
    const [game,setGame]=useState(null);
    const [toastMsg,setToastMsg]=useState(null);
    const [showSettings,setShowSettings]=useState(false);
    const [unitSheet,setUnitSheet]=useState(null);
    const [studyMode,setStudyModeState]=useState(()=>{ try{ const v=localStorage.getItem('milim_smode'); return ['all','batch','dont'].indexOf(v)>=0?v:'batch'; }catch(e){ return 'batch'; } });
    const setStudyMode=useCallback((m)=>{ setStudyModeState(m); try{ localStorage.setItem('milim_smode',m); }catch(e){} },[]);
    const [batchSize,setBatchSizeState]=useState(()=>{ try{ const v=parseInt(localStorage.getItem('milim_batch'),10); return [10,20].indexOf(v)>=0?v:20; }catch(e){ return 20; } });
    const setBatchSize=useCallback((s)=>{ setBatchSizeState(s); try{ localStorage.setItem('milim_batch',String(s)); }catch(e){} },[]);
    const [theme,setThemeState]=useState(()=>{ try{return localStorage.getItem('milim_theme')||null;}catch(e){return null;} });
    useEffect(()=>{ const r=document.documentElement; if(theme) r.setAttribute('data-theme',theme); else r.removeAttribute('data-theme'); try{ theme?localStorage.setItem('milim_theme',theme):localStorage.removeItem('milim_theme'); }catch(e){} },[theme]);
    const toast=useCallback((m)=>{ setToastMsg(m); setTimeout(()=>setToastMsg(null),1600); },[]);

    const setStatus=useCallback((id,val)=>{ commit(s=>{ const st=Object.assign({},s.status); if(val==null) delete st[id]; else st[id]=val; return Object.assign({},s,{status:st}); }); },[commit]);
    const setGroups=useCallback((g)=>commit(s=>Object.assign({},s,{groups:g})),[commit]);
    const replaceAll=useCallback((d)=>commit(s=>Object.assign({},s,d)),[commit]);
    const saveEdit=useCallback((id,w,m)=>{ commit(s=>{ const e=Object.assign({},s.edits); e[id]={w,m}; return Object.assign({},s,{edits:e}); }); setEditWord(null); toast('המילה נשמרה'); },[commit]);
    const resetEdit=useCallback((id)=>{ commit(s=>{ const e=Object.assign({},s.edits); delete e[id]; return Object.assign({},s,{edits:e}); }); setEditWord(null); toast('שוחזר למקור'); },[commit]);
    const saveScore=useCallback((gameKey,score,exit)=>{ if(!exit){ commit(s=>{ const st=Object.assign({},s.stats); const cur=st[gameKey]||{}; const isTime=gameKey==='match'; const best = cur.best==null?score:(isTime?Math.min(cur.best,score):Math.max(cur.best,score)); st[gameKey]=Object.assign({},cur,{best,plays:(cur.plays||0)+1}); return Object.assign({},s,{stats:st}); }); } else { setGame(null); } },[commit]);

    const setDeckStudy=useCallback((d,go,unk)=>{ setDeck(d); setOnlyUnknown(!!unk); setGame(null); setView(go==='games'?'games':'cards'); },[]);
    const startUnit=useCallback((d,go)=>{ setDeck(d); setOnlyUnknown(false); setGame(null); setUnitSheet(null); setView(go==='games'?'games':'cards'); },[]);
    const words=useMemo(()=>deckWords(deck,state.groups,state.status,state.edits,onlyUnknown),[deck,state.groups,state.status,state.edits,onlyUnknown]);
    const chunkMeta=useMemo(()=>{ if(!deck.cs) return null;
      const total=deckBaseArr(deck,state.groups).length; const size=deck.cs; const count=Math.max(1,Math.ceil(total/size));
      const ci=Math.min(deck.ci||0,count-1); const start=ci*size; const end=Math.min(start+size,total);
      return {size,count,ci,start,end,total}; },[deck,state.groups]);
    const navChunk=useCallback((dir)=>{ setDeck(d=>{ if(!d.cs) return d; const total=deckBaseArr(d,state.groups).length; const count=Math.max(1,Math.ceil(total/d.cs)); const ni=Math.min(Math.max(0,(d.ci||0)+dir),count-1); return Object.assign({},d,{ci:ni}); }); },[state.groups]);
    const dLabel=deckName(deck,state.groups)+(chunkMeta?` · מילים ${chunkMeta.start+1}–${chunkMeta.end}`:'')+(deck.filter==='dont'?' · רק «לא יודע»':'')+(onlyUnknown?' · לא ידעתי':'');

    const openDeck=()=>setShowDeck(true);
    const pickDeck=(sel)=>{ if(sel.toggleUnknown){ setOnlyUnknown(u=>!u); return; }
      if(sel.type==='unit'){ setDeck(studyMode==='dont'?{type:'unit',key:sel.key,filter:'dont'}:studyMode==='batch'?{type:'unit',key:sel.key,cs:batchSize,ci:0}:{type:'unit',key:sel.key}); return; }
      setDeck(sel); };

    let body;
    if(view==='home') body=html`<${Home} status=${state.status} groups=${state.groups} setView=${setView} setDeckStudy=${setDeckStudy} setUnitSheet=${setUnitSheet}/>`;
    else if(view==='cards') body=html`<div class="page"><${Flashcards} words=${words} status=${state.status} setStatus=${setStatus} onEdit=${w=>setEditWord(w)} deckLabel=${dLabel} onChangeDeck=${openDeck} chunk=${chunkMeta} onChunk=${navChunk}/></div>`;
    else if(view==='games') body=html`<div class="page">${game? html`<${GameHost} gameKey=${game} words=${words} onExit=${()=>setGame(null)} onScore=${saveScore} best=${state.stats[game]?state.stats[game].best:null}/>`
        : html`<${GamesMenu} onPlay=${k=>setGame(k)} stats=${state.stats} deckLabel=${dLabel} onChangeDeck=${openDeck} count=${words.length} chunk=${chunkMeta} onChunk=${navChunk}/>`}</div>`;
    else if(view==='groups') body=html`<div class="page"><${Groups} groups=${state.groups} setGroups=${setGroups} status=${state.status} edits=${state.edits} onStudy=${setDeckStudy} toast=${toast}/></div>`;
    else if(view==='words') body=html`<div class="page"><${WordList} status=${state.status} setStatus=${setStatus} edits=${state.edits} onEdit=${w=>setEditWord(w)} toast=${toast}/></div>`;

    const tabs=[['home','בית','⌂'],['cards','כרטיסיות','🃏'],['games','משחקים','🎮'],['groups','קבוצות','📁'],['words','מילון','📖']];
    return html`<${Fragment}>
      <${AppBar} view=${view} setView=${setView} theme=${theme} setTheme=${setThemeState} onSettings=${()=>setShowSettings(true)}/>
      ${body}
      <nav class="tabbar"><div class="inner">${tabs.map(([k,l,ic])=>html`<button class=${'tab '+(view===k?'on':'')} key=${k} onClick=${()=>{setView(k); if(k!=='games')setGame(null);}}><span class="ic">${ic}</span><span>${l}</span></button>`)}</div></nav>
      ${showDeck?html`<${DeckSheet} deck=${deck} onlyUnknown=${onlyUnknown} groups=${state.groups} status=${state.status} onClose=${()=>setShowDeck(false)} onPick=${pickDeck}/>`:''}
      ${editWord?html`<${EditSheet} word=${effWord(editWord,state.edits)} isEdited=${!!state.edits[editWord.id]} onClose=${()=>setEditWord(null)} onSave=${(w,m)=>saveEdit(editWord.id,w,m)} onReset=${()=>resetEdit(editWord.id)}/>`:''}
      ${showSettings?html`<${SettingsSheet} state=${state} onReplace=${replaceAll} onClose=${()=>setShowSettings(false)} toast=${toast}/>`:''}
      ${unitSheet!=null?html`<${UnitSheet} unit=${unitSheet} status=${state.status} mode=${studyMode} setMode=${setStudyMode} batchSize=${batchSize} setBatchSize=${setBatchSize} onStart=${startUnit} onClose=${()=>setUnitSheet(null)}/>`:''}
      <${Toast} msg=${toastMsg}/>
    </${Fragment}>`;
  }

  render(html`<${App}/>`, document.getElementById('app'));
})();
</script>
<script>
  // register the service worker for offline use (ignored where unsupported, e.g. inside claude.ai)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
</script>
</body>
</html>
